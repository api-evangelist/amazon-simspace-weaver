                DeleteSimulation484Example:
                  summary: Default DeleteSimulation 484
                  x-microcks-default: true
                  value: example-value
      parameters:
      - name: simulation
        in: query
        required: true
        description: The name of the simulation.
        schema:
          type: string
          pattern: ^[a-zA-Z0-9_.-]+$
          minLength: 1
          maxLength: 64
      summary: Amazon Delete Simulation
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      tags:
