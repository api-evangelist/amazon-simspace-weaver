    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    delete:
      operationId: DeleteSimulation
      description: 'Deletes all SimSpace Weaver resources assigned to the given simulation.


        Your simulation uses resources in other Amazon Web Services. This API operation doesn''t delete resources in other Amazon Web Services.'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteSimulationOutput'
              examples:
                DeleteSimulation200Example:
                  summary: Default DeleteSimulation 200
                  x-microcks-default: true
                  value: {}
        '480':
          description: ResourceNotFoundException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceNotFoundException'
              examples:
                DeleteSimulation480Example:
                  summary: Default DeleteSimulation 480
                  x-microcks-default: true
                  value: example-value
        '481':
          description: InternalServerException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerException'
              examples:
                DeleteSimulation481Example:
                  summary: Default DeleteSimulation 481
                  x-microcks-default: true
                  value: example-value
        '482':
          description: AccessDeniedException
          content:
            application/json:
              schema:
