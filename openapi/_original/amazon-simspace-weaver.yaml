      - STARTED
      - STOPPING
      - STOPPED
      - ERROR
      - UNKNOWN
    SimulationAppTargetStatus:
      type: string
      enum:
      - UNKNOWN
      - STARTED
      - STOPPED
    DescribeSimulationInput:
      type: object
      title: DescribeSimulationInput
      properties: {}
    SimSpaceWeaverArn:
      type: string
      pattern: '^arn:(?:aws|aws-cn|aws-us-gov):simspaceweaver:([a-z]{2}-[a-z]+-\d{1}):(\d{12})?:([a-z]+)\/(.+)$'
      minLength: 0
      maxLength: 1600
    Timestamp:
      type: string
      format: date-time
    UUID:
      type: string
      pattern: '^[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}$'
      minLength: 36
    LiveSimulationState:
      type: object
      properties:
        Clocks:
          allOf:
          - $ref: '#/components/schemas/SimulationClockList'
          - description: '<p>A list of simulation clocks.</p> <note> <p>At this time, a simulation has only one clock.</p> </note>'
        Domains:
          allOf:
          - $ref: '#/components/schemas/DomainList'
          - description: 'A list of domains for the simulation. For more information about domains, see <a href="https://docs.aws.amazon.com/simspaceweaver/latest/userguide/what-is_key-concepts.html#what-is_key-concepts_domains">Key
              concepts: Domains</a> in the <i>SimSpace Weaver User Guide</i>.'
      description: 'A collection of additional state information, such as domain and clock configuration.'
    LoggingConfiguration:
      type: object
      properties:
        Destinations:
          allOf:
          - $ref: '#/components/schemas/LogDestinations'
          - description: A list of the locations where SimSpace Weaver sends simulation log data.
      description: The logging configuration for a simulation.
    TimeToLiveString:
      type: string
      pattern: '^\d{1,5}[mhdMHD]$'
      minLength: 2
      maxLength: 6
    RoleArn:
      type: string
      pattern: '^arn:(?:aws|aws-cn|aws-us-gov):iam::(\d{12})?:role\/(.+)$'
      minLength: 0
      maxLength: 1600
    OptionalString:
      type: string
    S3Location:
      type: object
      properties:
        BucketName:
          allOf:
          - $ref: '#/components/schemas/BucketName'
          - description: 'The name of an Amazon S3 bucket. For more information about buckets, see <a href="https://docs.aws.amazon.com/AmazonS3/latest/userguide/creating-buckets-s3.html">Creating, configuring,
              and working with Amazon S3 buckets</a> in the <i>Amazon Simple Storage Service User Guide</i>.'
        ObjectKey:
          allOf:
          - $ref: '#/components/schemas/ObjectKey'
          - description: 'The key name of an object in Amazon S3. For more information about Amazon S3 objects and object keys, see <a href="https://docs.aws.amazon.com/AmazonS3/latest/userguide/uploading-downloading-objects.html">Uploading,
              downloading, and working with objects in Amazon S3</a> in the <i>Amazon Simple Storage Service User Guide</i>.'
      description: 'A location in Amazon Simple Storage Service (Amazon S3) where SimSpace Weaver stores simulation data, such as your app .zip files and schema file. For more information about Amazon S3,
        see the <a href="https://docs.aws.amazon.com/AmazonS3/latest/userguide/Welcome.html"> <i>Amazon Simple Storage Service User Guide</i> </a>.'
    SimulationStatus:
      type: string
      enum:
      - UNKNOWN
      - STARTING
      - STARTED
      - STOPPING
      - STOPPED
      - FAILED
      - DELETING
      - DELETED
      - SNAPSHOT_IN_PROGRESS
    SimulationTargetStatus:
      type: string
      enum:
      - UNKNOWN
      - STARTED
      - STOPPED
      - DELETED
    LifecycleManagementStrategy:
      type: string
      enum:
      - Unknown
      - PerWorker
      - BySpatialSubdivision
      - ByRequest
    Domain:
      type: object
      properties:
        Lifecycle:
          allOf:
          - $ref: '#/components/schemas/LifecycleManagementStrategy'
          - description: '<p>The type of lifecycle management for apps in the domain. Indicates whether apps in this domain are <i>managed</i> (SimSpace Weaver starts and stops the apps) or <i>unmanaged</i>
              (you must start and stop the apps).</p> <p class="title"> <b>Lifecycle types</b> </p> <ul> <li> <p> <code>PerWorker</code> – Managed: SimSpace Weaver starts one app on each worker.</p> </li>
              <li> <p> <code>BySpatialSubdivision</code> – Managed: SimSpace Weaver starts one app for each spatial partition.</p> </li> <li> <p> <code>ByRequest</code> – Unmanaged: You use the <code>StartApp</code>
              API to start the apps and use the <code>StopApp</code> API to stop the apps.</p> </li> </ul>'
        Name:
          allOf:
          - $ref: '#/components/schemas/SimSpaceWeaverResourceName'
          - description: The name of the domain.
      description: '<p>A collection of app instances that run the same executable app code and have the same launch options and commands.</p> <p>For more information about domains, see <a href="https://docs.aws.amazon.com/simspaceweaver/latest/userguide/what-is_key-concepts.html#what-is_key-concepts_domains">Key
        concepts: Domains</a> in the <i>SimSpace Weaver User Guide</i>.</p>'
    DomainList:
      type: array
      items:
        $ref: '#/components/schemas/Domain'
    NonEmptyString:
      type: string
      minLength: 1
      maxLength: 1600
    PositiveInteger:
      type: integer
      minimum: 1
    ListAppsInput:
      type: object
      title: ListAppsInput
      properties: {}
    SimulationAppList:
      type: array
      items:
        $ref: '#/components/schemas/SimulationAppMetadata'
    ListSimulationsInput:
      type: object
      title: ListSimulationsInput
      properties: {}
    SimulationList:
      type: array
      items:
        $ref: '#/components/schemas/SimulationMetadata'
    ListTagsForResourceInput:
      type: object
      title: ListTagsForResourceInput
      properties: {}
    TagMap:
      type: object
      minProperties: 1
      maxProperties: 50
      additionalProperties:
        $ref: '#/components/schemas/TagValue'
    SimulationClockList:
      type: array
      items:
        $ref: '#/components/schemas/SimulationClock'
    LogDestination:
      type: object
      properties:
        CloudWatchLogsLogGroup:
          allOf:
          - $ref: '#/components/schemas/CloudWatchLogsLogGroup'
          - description: 'An Amazon CloudWatch Logs log group that stores simulation log data. For more information about log groups, see <a href="https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/Working-with-log-groups-and-streams.html">Working
              with log groups and log streams</a> in the <i>Amazon CloudWatch Logs User Guide</i>.'
      description: The location where SimSpace Weaver sends simulation log data.
    LogDestinations:
      type: array
      items:
        $ref: '#/components/schemas/LogDestination'
    PortNumber:
      type: integer
      minimum: 0
      maximum: 65535
    SimulationAppMetadata:
      type: object
      properties:
        Domain:
          allOf:
          - $ref: '#/components/schemas/SimSpaceWeaverResourceName'
          - description: 'The domain of the app. For more information about domains, see <a href="https://docs.aws.amazon.com/simspaceweaver/latest/userguide/what-is_key-concepts.html#what-is_key-concepts_domains">Key
              concepts: Domains</a> in the <i>SimSpace Weaver User Guide</i>.'
        Name:
          allOf:
          - $ref: '#/components/schemas/SimSpaceWeaverLongResourceName'
          - description: The name of the app.
        Simulation:
          allOf:
          - $ref: '#/components/schemas/SimSpaceWeaverResourceName'
          - description: The name of the simulation of the app.
        Status:
          allOf:
          - $ref: '#/components/schemas/SimulationAppStatus'
          - description: The current status of the app.
        TargetStatus:
          allOf:
          - $ref: '#/components/schemas/SimulationAppTargetStatus'
          - description: The desired status of the app.
      description: A collection of metadata about the app.
    SimulationClock:
      type: object
      properties:
        Status:
          allOf:
          - $ref: '#/components/schemas/ClockStatus'
          - description: The current status of the simulation clock.
        TargetStatus:
          allOf:
          - $ref: '#/components/schemas/ClockTargetStatus'
          - description: The desired status of the simulation clock.
      description: Status information about the simulation clock.
    SimulationMetadata:
      type: object
      properties:
        Arn:
          allOf:
          - $ref: '#/components/schemas/SimSpaceWeaverArn'
          - description: 'The Amazon Resource Name (ARN) of the simulation. For more information about ARNs, see <a href="https://docs.aws.amazon.com/general/latest/gr/aws-arns-and-namespaces.html">Amazon
              Resource Names (ARNs)</a> in the <i>Amazon Web Services General Reference</i>.'
        CreationTime:
          allOf:
          - $ref: '#/components/schemas/Timestamp'
          - description: 'The time when the simulation was created, expressed as the number of seconds and milliseconds in UTC since the Unix epoch (0:0:0.000, January 1, 1970).'
        Name:
          allOf:
          - $ref: '#/components/schemas/SimSpaceWeaverResourceName'
          - description: The name of the simulation.
        Status:
          allOf:
          - $ref: '#/components/schemas/SimulationStatus'
          - description: The current status of the simulation.
        TargetStatus:
          allOf:
          - $ref: '#/components/schemas/SimulationTargetStatus'
          - description: The desired status of the simulation.
      description: A collection of data about the simulation.
    StartAppInput:
      type: object
      required:
      - Domain
      - Name
      - Simulation
      title: StartAppInput
      properties:
        ClientToken:
          allOf:
          - $ref: '#/components/schemas/ClientToken'
          - description: A value that you provide to ensure that repeated calls to this API operation using the same parameters complete only once. A <code>ClientToken</code> is also known as an 
              <i>idempotency token</i>. A <code>ClientToken</code> expires after 24 hours.
        Description:
          allOf:
          - $ref: '#/components/schemas/Description'
          - description: The description of the app.
        Domain:
          allOf:
          - $ref: '#/components/schemas/SimSpaceWeaverResourceName'
          - description: The name of the domain of the app.
        LaunchOverrides:
          $ref: '#/components/schemas/LaunchOverrides'
        Name:
          allOf:
          - $ref: '#/components/schemas/SimSpaceWeaverResourceName'
          - description: The name of the app.
        Simulation:
          allOf:
          - $ref: '#/components/schemas/SimSpaceWeaverResourceName'
          - description: The name of the simulation of the app.
    StartClockInput:
      type: object
      required:
      - Simulation
      title: StartClockInput
      properties:
        Simulation:
          allOf:
          - $ref: '#/components/schemas/SimSpaceWeaverResourceName'
          - description: The name of the simulation.
    StartSimulationInput:
      type: object
      required:
      - Name
      - RoleArn
      title: StartSimulationInput
      properties:
        ClientToken:
          allOf:
          - $ref: '#/components/schemas/ClientToken'
          - description: A value that you provide to ensure that repeated calls to this API operation using the same parameters complete only once. A <code>ClientToken</code> is also known as an 
              <i>idempotency token</i>. A <code>ClientToken</code> expires after 24 hours.
        Description:
          allOf:
          - $ref: '#/components/schemas/Description'
          - description: The description of the simulation.
        MaximumDuration:
          allOf:
          - $ref: '#/components/schemas/TimeToLiveString'
          - description: 'The maximum running time of the simulation, specified as a number of minutes (m or M), hours (h or H), or days (d or D). The simulation stops when it reaches this limit. The maximum
              value is <code>14D</code>, or its equivalent in the other units. The default value is <code>14D</code>. A value equivalent to <code>0</code> makes the simulation immediately transition to
              <code>Stopping</code> as soon as it reaches <code>Started</code>.'
        Name:
          allOf:
          - $ref: '#/components/schemas/SimSpaceWeaverResourceName'
          - description: The name of the simulation.
        RoleArn:
          allOf:
          - $ref: '#/components/schemas/RoleArn'
          - description: 'The Amazon Resource Name (ARN) of the Identity and Access Management (IAM) role that the simulation assumes to perform actions. For more information about ARNs, see <a href="https://docs.aws.amazon.com/general/latest/gr/aws-arns-and-namespaces.html">Amazon
              Resource Names (ARNs)</a> in the <i>Amazon Web Services General Reference</i>. For more information about IAM roles, see <a href="https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles.html">IAM
              roles</a> in the <i>Identity and Access Management User Guide</i>.'
        SchemaS3Location:
          allOf:
          - $ref: '#/components/schemas/S3Location'
          - description: '<p>The location of the simulation schema in Amazon Simple Storage Service (Amazon S3). For more information about Amazon S3, see the <a href="https://docs.aws.amazon.com/AmazonS3/latest/userguide/Welcome.html">
              <i>Amazon Simple Storage Service User Guide</i> </a>.</p> <p>Provide a <code>SchemaS3Location</code> to start your simulation from a schema.</p> <p>If you provide a <code>SchemaS3Location</code>
              then you can''t provide a <code>SnapshotS3Location</code>.</p>'
        SnapshotS3Location:
          allOf:
          - $ref: '#/components/schemas/S3Location'
          - description: '<p>The location of the snapshot .zip file in Amazon Simple Storage Service (Amazon S3). For more information about Amazon S3, see the <a href="https://docs.aws.amazon.com/AmazonS3/latest/userguide/Welcome.html">
              <i>Amazon Simple Storage Service User Guide</i> </a>.</p> <p>Provide a <code>SnapshotS3Location</code> to start your simulation from a snapshot.</p> <p>The Amazon S3 bucket must be in the
              same Amazon Web Services Region as the simulation.</p> <p>If you provide a <code>SnapshotS3Location</code> then you can''t provide a <code>SchemaS3Location</code>.</p>'
        Tags:
          allOf:
          - $ref: '#/components/schemas/TagMap'
          - description: 'A list of tags for the simulation. For more information about tags, see <a href="https://docs.aws.amazon.com/general/latest/gr/aws_tagging.html">Tagging Amazon Web Services resources</a>
              in the <i>Amazon Web Services General Reference</i>.'
    StopAppInput:
      type: object
      required:
      - App
      - Domain
      - Simulation
      title: StopAppInput
